name: Tennis AI Daily

on:
  schedule:
    - cron: '0 7 * * *'  # Reggel 7-kor
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install
      run: pip install numpy requests scikit-learn xgboost
    
    - name: Run predictions
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      run: |
        mkdir -p results
        python main.py --today --output json
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: predictions
        path: results/
