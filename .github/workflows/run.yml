name: Tennis AI Daily Predictions

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      player1:
        description: 'First player name'
        required: false
        default: 'Novak Djokovic'
      player2:
        description: 'Second player name'
        required: false
        default: 'Carlos Alcaraz'
      surface:
        description: 'Surface type'
        required: false
        default: 'hard'
        type: choice
        options:
          - hard
          - clay
          - grass
          - indoor

jobs:
  predict:
    name: Generate Tennis Predictions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create necessary directories
      run: |
        mkdir -p models data/raw data/processed results logs
    
    - name: Run predictions
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          python main.py \
            --player1 "${{ github.event.inputs.player1 }}" \
            --player2 "${{ github.event.inputs.player2 }}" \
            --surface "${{ github.event.inputs.surface }}" \
            --output json
        else
          echo "Running scheduled predictions..."
          python main.py --player1 "Novak Djokovic" --player2 "Carlos Alcaraz" --surface hard --output json
        fi
    
    - name: Upload prediction results
      uses: actions/upload-artifact@v4
      with:
        name: prediction-results
        path: results/
        retention-days: 30
