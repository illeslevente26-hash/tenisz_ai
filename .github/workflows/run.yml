name: Tennis AI Real Predictions

on:
  schedule:
    - cron: '0 8 * * *'   # Minden reggel 8-kor
    - cron: '0 14 * * *'  # Délután 2-kor is
  workflow_dispatch:
    inputs:
      players:
        description: 'Manual match (Player1 vs Player2)'
        required: false
        default: 'Djokovic vs Alcaraz'

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install numpy pandas scikit-learn xgboost requests joblib
    
    - name: Create directories
      run: mkdir -p results logs
    
    - name: Run predictions
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Manual run
          python main.py --today --output json
        else
          # Scheduled run
          python main.py --today --output json
        fi
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: tennis-predictions-${{ github.run_id }}
        path: results/
        retention-days: 7
    
    - name: Save to repo
      run: |
        git config user.name 'Tennis AI Bot'
        git config user.email 'bot@example.com'
        git add results/ logs/
        git diff --quiet || (git commit -m "🎾 Predictions $(date +%Y-%m-%d)" && git push)
