name: Tennis AI Daily

on:
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install packages
      run: |
        pip install --upgrade pip
        pip install numpy requests scikit-learn xgboost
    
    - name: Create directories
      run: |
        mkdir -p results
        mkdir -p logs
    
    - name: Run predictions
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      run: |
        echo "API Key hossza: ${#RAPIDAPI_KEY}"
        python main.py --today --output json 2>&1 | tee logs/run.log
    
    - name: Check results
      run: |
        echo "Results mappa tartalma:"
        ls -la results/ || echo "Results mappa üres"
        echo ""
        echo "Log fájl tartalma:"
        cat logs/run.log || echo "Nincs log fájl"
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: predictions-${{ github.run_id }}
        path: |
          results/
          logs/
        retention-days: 7
