```yaml
name: Tennis AI Analyst

on:
  workflow_dispatch:

  schedule:
    # Minden nap 06:00 UTC = 08:00 magyar idő nyáron
    - cron: "0 6 * * *"

    # Minden nap 12:00 UTC = 14:00 magyar idő nyáron
    - cron: "0 12 * * *"

    # Minden nap 18:00 UTC = 20:00 magyar idő nyáron
    - cron: "0 18 * * *"

jobs:
  tennis-analysis:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # API KEY CHECK
      # ------------------------------------------------------

      - name: Check API key
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          if [ -z "$API_TENNIS_KEY" ]; then
            echo "❌ API_TENNIS_KEY secret nincs beállítva!"
            exit 1
          fi

          echo "✅ API_TENNIS_KEY secret megtalálható."

      # ------------------------------------------------------
      # RUN TENNIS ANALYST
      # ------------------------------------------------------

      - name: Run Tennis AI Analyst
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          python main.py --today --json

      # ------------------------------------------------------
      # SAVE RESULTS
      # ------------------------------------------------------

      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-predictions-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
```
