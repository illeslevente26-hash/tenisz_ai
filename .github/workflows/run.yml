name: Tennis AI Daily Predictions

on:
  schedule:
    # Futás minden nap reggel 8:00-kor (UTC)
    - cron: '0 8 * * *'
    # És minden nap este 20:00-kor
    - cron: '0 20 * * *'
  # Manuális futtatás lehetősége
  workflow_dispatch:
    inputs:
      player1:
        description: 'Első játékos neve'
        required: false
        default: 'Novak Djokovic'
      player2:
        description: 'Második játékos neve'
        required: false
        default: 'Carlos Alcaraz'
      surface:
        description: 'Borítás típusa'
        required: false
        default: 'hard'
        type: choice
        options:
          - hard
          - clay
          - grass
          - indoor

jobs:
  predict:
    name: Generate Tennis Predictions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v
